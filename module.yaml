# 模块清单：平台靠它认识这个模块，规则见 https://github.com/Beane-Big/vibebooth/blob/main/docs/module-spec.md
platform: 1              # 遵循的模块规范版本
id: schedule2date        # 全局唯一，也是网址前缀 /apps/schedule2date/ 和 /api/schedule2date/
name: "班表"
description: "排期班表"
icon: icon.svg
version: 0.1.0           # 发布新版本前改大
services:                # 哪个容器接哪个网址前缀，安装器据此生成网关路由
  frontend: {port: 80}   # 容器 schedule2date-frontend → /apps/schedule2date/
  backend: {port: 8000}  # 容器 schedule2date-backend → /api/schedule2date/，健康检查 /api/schedule2date/health
menus:                   # 模块的页面；管理员在门户“用户”页按人勾选，default 是默认拥有它的角色
  - {id: home, name: "班表", path: /apps/schedule2date/, default: [user]}
permissions:             # 功能权限；管理员在门户“用户”页按人开关，后端用 Has("<id>") 检查
  - {id: view, name: "查看班表", description: "查看、下载和分享当前班表", default: [user]}
  - {id: make, name: "制作班表", description: "导入班表文件，编辑格子内容、样式和图片设置；有这项权限也能查看", default: [admin]}
# requires: [contacts>=0.2]  # 要调用其他模块的对外接口时写上对方
